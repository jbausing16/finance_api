version: "3.9"

services:
  web:
    build: .
    command: daphne -b 0.0.0.0 -p 9000 app.asgi:application
    ports:
      - "9000:9000"
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings
    depends_on:
      - redis
      - db
      # - celery
    restart: always
  redis:
    image: redis:alpine
    # ports:
    #   - "6379:6379"
    restart: always
  app:
    build:
      context: .
      args:
        - DEV=true
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    command: >
      sh -c "
        python manage.py periodic_task &&
        python manage.py runserver 0.0.0.0:8000
      "

    environment:
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASS=changeme
      - DEBUG=1
    depends_on:
      - db
  db:
    image: postgres:13-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme
  celery:
    build: .
    command: celery -A app worker --loglevel=info
    depends_on:
      - redis
      - db
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASS=changeme
    restart: always
  celery-beat:
    build: .
    command: celery -A app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - redis
      - db
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASS=changeme
    restart: always
volumes:
  dev-db-data:
